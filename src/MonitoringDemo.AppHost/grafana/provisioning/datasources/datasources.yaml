apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: $PROMETHEUS_DATASOURCE_URL
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: $LOKI_DATASOURCE_URL
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: 'trace[_]?id'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: 'View trace in Tempo'
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: $TEMPO_DATASOURCE_URL
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        filterBySpanID: true
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: service_name
          - key: operation
          - key: outcome
        queries:
          - name: Request rate
            query: 'sum(rate(http_server_request_duration_seconds_count{service_name="$${__span.tags[\"service.name\"]}"}[$${__rate_interval}]))'
          - name: Correlated operation latency
            query: 'histogram_quantile(0.95, sum by (le) (rate(correlation_demo_duration_ms_bucket{$${__tags}}[$${__rate_interval}])))'
    editable: false
