apiVersion: 1

groups:
  - orgId: 1
    name: Grafana learning rules
    folder: MonitoringDemo
    interval: 1m
    rules:
      - uid: grafana-demo-query-errors
        title: Grafana demo query errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(grafana_demo_query_errors_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions: []
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: grafana-fundamentals
        panelId: 4
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          description: More than two seeded Grafana query errors were observed in five minutes.
          summary: Grafana demo query errors are elevated
        labels:
          service: monitoring-demo
          severity: warning
        isPaused: false
