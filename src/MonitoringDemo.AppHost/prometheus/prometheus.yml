global:
  scrape_interval: __SCRAPE_INTERVAL__
  evaluation_interval: __EVALUATION_INTERVAL__

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'apiservice'
    metrics_path: '/metrics'
    scrape_interval: __API_SCRAPE_INTERVAL__
    file_sd_configs:
      - files:
          - /tmp/apiservice-targets.json
        refresh_interval: 30s

  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    scrape_interval: __API_SCRAPE_INTERVAL__
    static_configs:
      - targets: ['__COLLECTOR_METRICS_TARGET__']
