global:
  scrape_interval: __SCRAPE_INTERVAL__
  evaluation_interval: __EVALUATION_INTERVAL__

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'apiservice'
    metrics_path: '/metrics'
    scrape_interval: __API_SCRAPE_INTERVAL__
    static_configs:
      - targets: ['__API_METRICS_TARGET__']
        labels:
          application: 'MonitoringDemo.ApiService'
          environment: 'development'
